name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # t4g.* instances are Graviton (arm64) — image must match.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: "ec2 instance"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Write deploy script
        run: |
          cat > /tmp/deploy.sh <<SCRIPT
          #!/bin/bash
          set -euxo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.IMAGE }}:${{ github.sha }}

          tee /home/ubuntu/app.env > /dev/null <<'ENVEOF'
          PORT=8080
          AWS_REGION=sa-east-1
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          AUTH_JWKS_URL=${{ secrets.AUTH_JWKS_URL }}
          AUTH_JWT_ISSUER=${{ secrets.AUTH_JWT_ISSUER }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          ENVEOF
          chmod 600 /home/ubuntu/app.env

          tee /home/ubuntu/Caddyfile > /dev/null <<'CADDYEOF'
          $(cat Caddyfile)
          CADDYEOF

          docker network create ez-tax-net 2>/dev/null || true

          docker stop ez-tax-backend || true
          docker rm ez-tax-backend || true

          docker run -d \
            --name ez-tax-backend \
            --network ez-tax-net \
            --restart unless-stopped \
            --env-file /home/ubuntu/app.env \
            ${{ env.IMAGE }}:${{ github.sha }}

          docker stop caddy || true
          docker rm caddy || true

          docker run -d \
            --name caddy \
            --network ez-tax-net \
            --restart unless-stopped \
            -p 80:80 -p 443:443 \
            -v /home/ubuntu/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v caddy_data:/data \
            -v caddy_config:/config \
            caddy:2-alpine

          docker image prune -af --filter "until=72h"
          SCRIPT

      # No SSH involved: this sends the script above to the instance via
      # SSM Run Command (the instance's IAM role lets it poll for and
      # execute this), so port 22 never needs to be open to GitHub.
      # Built as real JSON (not CLI shorthand) so the multi-line script
      # doesn't trip the shorthand-syntax parser.
      - name: Deploy via SSM Run Command
        run: |
          jq -n --rawfile script /tmp/deploy.sh \
            --arg instance "${{ secrets.EC2_INSTANCE_ID }}" \
            --arg comment "Deploy ${{ github.sha }}" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: $comment,
              Parameters: { commands: [$script] }
            }' > /tmp/ssm-payload.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-payload.json \
            --query "Command.CommandId" --output text)

          echo "Command sent: $COMMAND_ID — waiting for completion..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS"
            exit 1
          fi
